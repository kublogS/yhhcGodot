name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build game project
        run: dotnet build YouHaveToHaveCharacter_Godot.csproj --configuration Release

      - name: Run regression test suite
        run: dotnet run --project Tests/Yhhc.RefactorTests.csproj --configuration Release
